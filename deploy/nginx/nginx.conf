worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limit OTP / auth endpoints (soft protection for ~1000 users).
    # API burst must cover folder navigation: page + tools panel + going back.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Uncomment after you place TLS certs in deploy/nginx/ssl/
        # and switch compose nginx to expose 443 as well.
        #
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Uploaded media (profile images, step attachments)
        location /media/ {
            alias /var/www/media/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Django admin CSS/JS (WhiteNoise on backend). Must not fall through to Next.js.
        location /static/ {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Liveness probe for external monitoring / load balancers.
        location = /healthz/ {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
            access_log off;
        }

        # Django admin (rate limited: it is a password login form)
        location /admin/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api_limit burst=80 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/schema/ {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/docs/ {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Next.js app (default). proxy_http_version lives in proxy_params;
        # only override Connection/Upgrade for websocket HMR if needed.
        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
