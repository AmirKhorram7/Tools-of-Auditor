# Tauditor production stack (~1000 active users)
#
# Images already on disk are reused. Hub images use pull_policy: missing.
# Local API/frontend images are named and pull_policy: never (never hit Hub
# for ta_code-backend / ta_code-frontend). build.pull: false so --build does
# not re-download python:3.13-slim or node:22-alpine.
#
# Daily start (no downloads, no rebuild):
#   docker compose up -d --pull missing --no-build
#
# After YOU change code, rebuild only what changed (layer cache, no Hub pull):
#   docker compose build --pull never backend frontend
#   docker compose up -d --no-build
#
# Do NOT make `up -d --build` a habit. --build rebuilds local Dockerfiles
# (pip/npm layers stay cached if requirements/lockfile did not change) but it
# is slower than starting the existing images. Python workers share
# ta_code-backend:latest — they are not built four times.
#
# First-time / missing Hub image (Postgres, Redis, nginx, Grafana): the one
# pull happens automatically with --pull missing, then never again.
# ClickHouse is built locally (`ta_code-clickhouse:local`) so Hub is not used.
#
# Usage on server:
#   1. cp .env.example .env   && edit secrets / domains
#   2. First boot: docker compose build --pull never backend frontend
#      then: docker compose up -d --pull missing --no-build
#      If Docker Hub times out on a *new* base image, tag a mirror first:
#        docker pull public.ecr.aws/docker/library/python:3.13-slim
#        docker tag  public.ecr.aws/docker/library/python:3.13-slim python:3.13-slim
#      If pip times out on pypi.org during backend build, set in .env:
#        PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
#        PIP_TRUSTED_HOST=mirrors.aliyun.com
#      then: docker compose build --pull never backend
#   3. open http://YOUR_SERVER_IP  (or configure TLS in deploy/nginx/nginx.conf)
#
# Monitoring (Grafana is the only UI you open):
#   http://127.0.0.1:3030  — default bind is localhost only (not on public :80)
#   Login: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD in .env
#   Remote server: ssh -L 3030:127.0.0.1:3030 user@YOUR_SERVER
#     then open http://127.0.0.1:3030 on your laptop.

# Cap container logs so a long-running server never fills the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-tauditor}
      POSTGRES_USER: ${DB_USER:-tauditor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tauditor} -d ${DB_NAME:-tauditor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not exposed publicly — only internal Docker network.

  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # News warehouse only. Not on the public site. Live traffic stays on Postgres.
  # Built locally from python:3.13-slim (already on disk). Do not `docker pull`
  # clickhouse/clickhouse-server — Hub/GCR TLS often times out here. After the
  # first `compose build clickhouse`, `up --no-build` reuses this tag forever.
  clickhouse:
    image: ta_code-clickhouse:local
    pull_policy: never
    build:
      context: ./deploy/clickhouse
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tauditor_news}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tauditor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    # Not published — backend talks to it on the Docker network only.

  backend:
    image: ta_code-backend:latest
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      # Service discovery inside the Docker network (overrides host .env values).
      # DB_* must use the same Compose interpolation as the db service —
      # do not rely only on env_file for the password (host env vs .env can diverge).
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-tauditor}
      DB_USER: ${DB_USER:-tauditor}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/1
      USE_REDIS_CACHE: "True"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tauditor_news}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tauditor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      # DEBUG / OTP_DEBUG_MODE / SMS keys come from .env (env_file)
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  reminder-worker:
    image: ta_code-backend:latest
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "manage.py", "send_due_reminders", "--loop"]
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-tauditor}
      DB_USER: ${DB_USER:-tauditor}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/1
      USE_REDIS_CACHE: "True"
      SKIP_STARTUP_MIGRATE: "1"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  news-worker:
    image: ta_code-backend:latest
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "ta_code.celery", "worker", "-l", "info"]
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-tauditor}
      DB_USER: ${DB_USER:-tauditor}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      USE_REDIS_CACHE: "True"
      SKIP_STARTUP_MIGRATE: "1"
      CELERY_TASK_ALWAYS_EAGER: "False"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tauditor_news}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tauditor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  news-beat:
    image: ta_code-backend:latest
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "ta_code.celery", "beat", "-l", "info"]
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-tauditor}
      DB_USER: ${DB_USER:-tauditor}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      USE_REDIS_CACHE: "True"
      SKIP_STARTUP_MIGRATE: "1"
      CELERY_TASK_ALWAYS_EAGER: "False"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tauditor_news}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tauditor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ta_code-frontend:latest
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      pull: false
      args:
        # Same-origin API via nginx → browser calls /api/v1/...
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://localhost}
        CACHEBUST: "dashboard-24"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - media_data:/var/www/media:ro
      # - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --- Monitoring: Prometheus stores metrics; Grafana is the dashboard UI. ---
  # Prometheus / exporters / cAdvisor are internal. Only Grafana is published.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    # Host CPU / RAM / disk. On Docker Desktop this is the Linux VM, not Windows.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Per-container CPU, RAM, network.

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_URI: "db:5432/${DB_NAME:-tauditor}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:-tauditor}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
      - redis-exporter
    # Not published — Grafana talks to it on the Docker network.

  grafana:
    image: grafana/grafana:11.3.0
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Localhost by default so the public site on :80 is unchanged.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3030}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tauditor-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  media_data:
  static_data:
  prometheus_data:
  grafana_data:
